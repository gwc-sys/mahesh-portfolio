name: Portfolio CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production site
        run: npm run build

      - name: Upload verified build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: portfolio-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Render
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deployment
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Render auto-deploy notice
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "Build passed. Render deploy hook is not configured; use Render's Git auto-deploy or add the RENDER_DEPLOY_HOOK_URL repository secret."
